name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript sources
        run: npm run check
      - name: Validate printable SVG worksheets
        run: |
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('public/worksheets')
          expected=['01-linework.svg','02-shading.svg','03-metallic-gold.svg','04-anubis.svg','05-dotwork.svg','06-metal-light.svg']
          for name in expected:
              path=root/name
              assert path.exists(), f'Missing: {name}'
              el=ET.parse(path).getroot()
              assert el.tag.endswith('svg'), f'Invalid SVG: {name}'
              assert el.attrib.get('viewBox')=='0 0 744 1052',f'A4 ratio missing: {name}'
              print(f'Validated {name}')
          PY
      - name: Build production
        run: npm run build
